<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plant Inventory — Plan roczny</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .yr-head { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--ink); margin-bottom: 1rem; padding-bottom: 0.55rem; border-bottom: 1px solid var(--rule); }
    .yr-filter { display: flex; gap: 6px; margin-bottom: 1.4rem; flex-wrap: wrap; }
    .yr-filter-btn { padding: 5px 13px; border: 1px solid var(--rule); border-radius: 2px; background: var(--leaf); font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); cursor: pointer; transition: all 0.15s; }
    .yr-filter-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
    .yr-filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .yr-month { margin-bottom: 1.3rem; }
    .yr-month-header { display: flex; align-items: baseline; gap: 11px; margin-bottom: 9px; }
    .yr-month-dot { width: 9px; height: 9px; border-radius: 2px; background: var(--accent); flex-shrink: 0; align-self: center; }
    .yr-month-dot.empty { background: var(--rule); }
    .yr-month-line { flex: 1; height: 1px; background: var(--rule-soft); }
    .yr-month-name { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--ink); min-width: 92px; }
    .yr-month-count { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-faint); }
    .yr-month.is-now .yr-month-name { color: var(--accent-ink); }
    .yr-month.is-now .yr-month-dot { background: var(--accent-ink); box-shadow: 0 0 0 3px var(--accent-wash); }
    .yr-now-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); border: 1px solid var(--accent-ink); border-radius: 2px; padding: 1px 6px; }

    .yr-tasks { padding-left: 21px; border-left: 1px solid var(--rule); margin-left: 4px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px; }
    .yr-task { background: var(--leaf); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 11px; display: flex; align-items: center; gap: 10px; transition: opacity 0.2s, background 0.15s; }
    .yr-task:hover { background: var(--paper-deep); }
    .yr-task.done { opacity: 0.5; }
    .yr-task.done .yr-task-desc { text-decoration: line-through; text-decoration-color: var(--ink-faint); }
    .yr-task-check { width: 16px; height: 16px; border: 1.5px solid var(--rule); border-radius: 2px; cursor: pointer; appearance: none; -webkit-appearance: none; background: var(--paper); flex-shrink: 0; position: relative; transition: all 0.15s; }
    .yr-task-check:checked { background: var(--accent-ink); border-color: var(--accent-ink); }
    .yr-task-check:checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 9px; border: 1.5px solid var(--leaf); border-top: none; border-left: none; transform: rotate(45deg); }
    .yr-task-body { flex: 1; min-width: 0; }
    .yr-task-desc { font-size: 13px; color: var(--ink); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .yr-task-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
    .yr-task-date { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); flex-shrink: 0; white-space: nowrap; }
    .yr-task-date.today { color: var(--accent-ink); font-weight: 500; }
    .yr-task-date.overdue { color: var(--alarm); }
    .yr-empty { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); padding: 4px 0 4px 21px; margin-left: 4px; border-left: 1px solid var(--rule); }

    /* MOBILE (page-specific; shared chrome lives in styles.css) */
    @media (max-width: 768px) {
      .yr-month-header { gap: 8px; }
      .yr-month-name { min-width: 76px; font-size: 14px; }
      .yr-tasks { padding-left: 14px; margin-left: 4px; }
      .yr-task { padding: 7px 9px; }
      .yr-task-desc { font-size: 12px; white-space: normal; }
      .yr-task-date { font-size: 10px; }
    }

  </style>
</head>
<body>
  <div class="banner">🌱 Aplikacja w trakcie rozwoju — dziękujemy za cierpliwość!</div>
  <div class="app">
    <div id="sidebar-mount"></div>

    <div class="main">
      <div class="topbar">
        <button class="toggle-btn" onclick="toggleSidebar()" aria-label="Przełącz menu">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="2" y1="4" x2="16" y2="4"/><line x1="2" y1="9" x2="16" y2="9"/><line x1="2" y1="14" x2="16" y2="14"/></svg>
        </button>
        <div class="topbar-title">Plan roczny</div>
      </div>

      <div class="content">
        <div class="yr-head">Kalendarz pielęgnacji — cały rok</div>
        <div class="yr-filter" id="filter-row">
          <button class="yr-filter-btn active" onclick="filterPlant('all', this)">Wszystkie rośliny</button>
        </div>
        <div id="timeline">
          <div class="empty-state">🌿 Ładowanie...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

    let allTasks = [];
    let currentFilter = 'all';

    function dateClass(str) {
      const d = new Date(str), t = new Date();
      t.setHours(0,0,0,0); d.setHours(0,0,0,0);
      if (d < t) return 'overdue';
      if (d.getTime() === t.getTime()) return 'today';
      return '';
    }

    function formatDay(str) {
      return new Date(str).toLocaleDateString('pl-PL', { day: 'numeric' });
    }

    function filterPlant(plant, btn) {
      currentFilter = plant;
      document.querySelectorAll('.yr-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTimeline();
    }

    function renderTimeline() {
      const filtered = currentFilter === 'all' ? allTasks : allTasks.filter(t => t.plant_name === currentFilter);
      const byMonth = {};
      for (let i = 1; i <= 12; i++) byMonth[i] = [];
      filtered.forEach(t => {
        const m = parseInt(t.date.split('-')[1]);
        if (m >= 1 && m <= 12) byMonth[m].push(t);
      });

      const nowMonth = new Date().getMonth() + 1;
      const html = Object.entries(byMonth).map(([m, mtasks]) => {
        const monthNum = parseInt(m);
        const hasTask = mtasks.length > 0;
        const isNow = monthNum === nowMonth;
        const taskHtml = mtasks.length
          ? mtasks.sort((a,b) => a.date.localeCompare(b.date)).map(t => {
              const dc = dateClass(t.date);
              return `<div class="yr-task ${t._done ? 'done' : ''}">
                <input type="checkbox" class="yr-task-check" ${t._done ? 'checked' : ''} onchange="toggleTask('${t.task_id}', this)"/>
                <div class="yr-task-body">
                  <div class="yr-task-desc">${t.description}</div>
                  <div class="yr-task-meta">${t.plant_name || ''}</div>
                </div>
                <div class="yr-task-date ${dc}">${dc === 'today' ? 'Dziś' : dc === 'overdue' ? 'Zaległe' : formatDay(t.date) + ' ' + MONTHS[monthNum-1].slice(0,3)}</div>
              </div>`;
            }).join('')
          : `<div class="yr-empty">Brak zadań</div>`;

        return `<div class="yr-month ${isNow ? 'is-now' : ''}">
          <div class="yr-month-header">
            <div class="yr-month-dot ${hasTask ? '' : 'empty'}"></div>
            <span class="yr-month-name">${MONTHS[monthNum-1]}</span>
            ${isNow ? '<span class="yr-now-tag">Teraz</span>' : ''}
            ${hasTask ? `<span class="yr-month-count">${mtasks.length} zadań</span>` : ''}
            <div class="yr-month-line"></div>
          </div>
          <div class="yr-tasks">${taskHtml}</div>
        </div>`;
      }).join('');

      document.getElementById('timeline').innerHTML = html;
    }

    async function toggleTask(id, cb) {
      const t = allTasks.find(t => t.task_id === id);
      if (t) {
        t._done = cb.checked;
        renderTimeline();
        try {
          await fetch(`${API}/tasks`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({task_id: id, user_id: USER_ID, status: cb.checked ? 'done' : 'pending'})
          });
        } catch(e) { console.error('Failed to update task:', e); }
      }
    }

    async function loadTasks() {
      try {
        const r = await fetch(`${API}/tasks?user_id=${USER_ID}`);
        const data = await r.json();
        allTasks = (Array.isArray(data) ? data : JSON.parse(data.body || '[]')).map(t => ({...t, _done: t.status === 'done'}));

        const plants = [...new Set(allTasks.map(t => t.plant_name).filter(Boolean))];
        const filterRow = document.getElementById('filter-row');
        plants.forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'yr-filter-btn';
          btn.textContent = p;
          btn.onclick = () => filterPlant(p, btn);
          filterRow.appendChild(btn);
        });

        renderTimeline();
      } catch(e) {
        document.getElementById('timeline').innerHTML = '<div class="empty-state">🌿 Błąd ładowania. Sprawdź połączenie.</div>';
      }
    }

    loadTasks();
  </script>
</body>
</html>

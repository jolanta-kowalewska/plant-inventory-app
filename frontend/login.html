<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plant Inventory — Kalendarz ogrodnika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <style>
    /* login lives outside the app shell — give it its own layout */
    body { display: block; height: 100vh; overflow: hidden; }

    .title-page {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      height: 100vh;
    }

    /* --- Left: the almanac cover --- */
    .cover {
      position: relative;
      background: #241d14;
      color: #e8dcc1;
      padding: 3.4rem 3.2rem;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .cover::after {                 /* gilt season edge */
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 3px;
      background: linear-gradient(var(--spring), var(--summer) 38%, var(--autumn) 68%, var(--winter));
      opacity: 0.7;
    }
    .cover-rule {
      border-top: 1px solid rgba(232,220,193,0.22);
      margin: 1.4rem 0;
    }
    .cover-imprint {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.2em;
      text-transform: uppercase; color: #9c8a66;
    }
    .cover-title {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(40px, 5vw, 60px); line-height: 0.98;
      letter-spacing: -0.015em; color: #f4ead2; margin-top: 0.4rem;
    }
    .cover-title em { font-style: italic; font-weight: 500; color: var(--summer); }
    .cover-sub {
      font-family: var(--display); font-style: italic; font-weight: 500;
      font-size: 18px; color: #cdbf9e; margin-top: 0.9rem; max-width: 22ch; line-height: 1.4;
    }
    .wheel-wrap {
      margin-top: auto; display: flex; align-items: center; gap: 1.5rem;
    }
    .wheel { width: 168px; height: 168px; flex-shrink: 0; }
    .wheel-center-season {
      font-family: var(--display); font-weight: 900; font-size: 17px; fill: #f4ead2;
    }
    .wheel-center-date { font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em; fill: #9c8a66; }
    .wheel-legend { font-family: var(--mono); font-size: 11px; color: #b3a584; line-height: 1.9; }
    .wheel-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .wheel-legend .is-now { color: #f4ead2; }
    .wheel-legend .is-now b { font-weight: 500; }

    /* --- Right: the sign-in card --- */
    .entry {
      display: flex; align-items: center; justify-content: center;
      padding: 2.5rem; overflow-y: auto;
    }
    .card {
      width: 100%; max-width: 392px;
      background: var(--leaf);
      border: 1px solid var(--rule);
      border-radius: 3px;
      box-shadow: var(--shadow);
      padding: 2.2rem 2.3rem 2rem;
      position: relative;
      animation: fadeUp 0.6s ease both;
    }
    .card::before {                 /* punched index-card hole */
      content: ''; position: absolute; top: 16px; right: 18px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 1px solid var(--rule); background: var(--paper-deep);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .card-eyebrow {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .card-title {
      font-family: var(--display); font-weight: 600; font-size: 25px;
      color: var(--ink); margin: 6px 0 1.6rem; letter-spacing: -0.01em;
    }

    .field-wrap { margin-bottom: 1.05rem; }
    .field-label {
      display: block; font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px;
    }
    .field-input {
      width: 100%; height: 44px;
      border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 2px;
      background: var(--paper); padding: 0 13px;
      font-family: var(--body); font-size: 14.5px; color: var(--ink);
      outline: none; transition: border-color 0.18s, background 0.18s;
    }
    .field-input::placeholder { color: var(--ink-faint); }
    .field-input:focus { border-color: var(--accent-ink); border-bottom-color: var(--accent); background: var(--leaf); }

    .btn-login {
      width: 100%; height: 47px; margin-top: 0.6rem;
      background: var(--ink); border: 1px solid var(--ink); border-radius: 2px;
      color: var(--paper); font-family: var(--mono); font-size: 12px;
      letter-spacing: 0.06em; cursor: pointer;
      transition: background 0.18s, transform 0.08s;
    }
    .btn-login:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
    .btn-login:active { transform: scale(0.99); }

    #login-status {
      margin-top: 1rem; padding: 0.7rem 0.9rem; border-radius: 2px;
      font-family: var(--mono); font-size: 11.5px; display: none;
    }
    .footer-note {
      margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule-soft);
      font-size: 12px; line-height: 1.55; color: var(--ink-soft);
    }

    @media (max-width: 860px) {
      .title-page { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
      body { overflow-y: auto; }
      .cover { padding: 2.4rem 1.8rem; }
      .cover::after { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 3px;
        background: linear-gradient(90deg, var(--spring), var(--summer) 38%, var(--autumn) 68%, var(--winter)); }
      .wheel-wrap { margin-top: 1.8rem; }
      .entry { padding: 1.8rem 1.4rem 2.6rem; }
    }
    @media (max-width: 480px) {
      .wheel { width: 132px; height: 132px; }
      .cover-title { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="title-page">
    <!-- The almanac cover -->
    <section class="cover">
      <div class="cover-imprint">Wydanie domowe · od 2024</div>
      <div class="cover-rule"></div>
      <h1 class="cover-title">Plant<br><em>Inventory</em></h1>
      <p class="cover-sub">Kalendarz ogrodnika — Twój ogród, zaplanowany rok po roku.</p>

      <div class="wheel-wrap">
        <svg class="wheel" viewBox="0 0 180 180" id="year-wheel" aria-label="Koło pór roku"></svg>
        <div class="wheel-legend" id="wheel-legend"></div>
      </div>
    </section>

    <!-- The sign-in index card -->
    <section class="entry">
      <div class="card">
        <div class="card-eyebrow">Karta ogrodnika</div>
        <h2 class="card-title">Załóż swój kalendarz</h2>

        <div class="field-wrap">
          <label class="field-label" for="name-input">Imię</label>
          <input class="field-input" type="text" placeholder="np. Anna" id="name-input"/>
        </div>
        <div class="field-wrap">
          <label class="field-label" for="email-input">Email</label>
          <input class="field-input" type="email" placeholder="imie@example.com" id="email-input"/>
        </div>
        <div class="field-wrap">
          <label class="field-label" for="location-input">Lokalizacja</label>
          <input class="field-input" type="text" placeholder="np. Warszawa" id="location-input"/>
        </div>

        <button class="btn-login" onclick="handleLogin()">Otwórz kalendarz →</button>

        <div id="login-status"></div>

        <p class="footer-note">
          Wersja demonstracyjna Plant Inventory. Twoje dane zapisujemy lokalnie w przeglądarce.
        </p>
      </div>
    </section>
  </div>

<script>
const API = 'https://c072lvqc8i.execute-api.eu-central-1.amazonaws.com/dev';

/* --- the gardener's seasons, mirrored from app.js --- */
const SEASONS = {
  winter: { label: 'Zima',   accent: '#5b7184', ink: '#33414c', months: [11,0,1], frac: [11/12, 14/12] },
  spring: { label: 'Wiosna', accent: '#6e8e3f', ink: '#3f5121', months: [2,3,4],  frac: [2/12, 5/12]   },
  summer: { label: 'Lato',   accent: '#bf8a2c', ink: '#4a3712', months: [5,6,7],  frac: [5/12, 8/12]   },
  autumn: { label: 'Jesień', accent: '#a65420', ink: '#5a2d11', months: [8,9,10], frac: [8/12, 11/12]  },
};
const order = ['spring','summer','autumn','winter'];

function seasonFor(d) {
  const m = d.getMonth();
  for (const s of Object.values(SEASONS)) if (s.months.includes(m)) return s;
  return SEASONS.summer;
}
function yearFraction(d) {
  const start = new Date(d.getFullYear(), 0, 1), next = new Date(d.getFullYear()+1, 0, 1);
  return (d - start) / (next - start);
}
function polar(cx, cy, r, frac) {
  const a = (frac * 360 - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, f0, f1) {
  const [x0, y0] = polar(cx, cy, r, f0), [x1, y1] = polar(cx, cy, r, f1);
  const large = (f1 - f0) > 0.5 ? 1 : 0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

(function paintSeason() {
  const now = new Date();
  const s = seasonFor(now);
  const root = document.documentElement.style;
  root.setProperty('--accent', s.accent);
  root.setProperty('--accent-ink', s.ink);

  // year-wheel
  const cx = 90, cy = 90, r = 62;
  const arcs = order.map(k => {
    const sea = SEASONS[k];
    const active = k === Object.keys(SEASONS).find(key => SEASONS[key] === s);
    return `<path d="${arcPath(cx, cy, r, sea.frac[0], sea.frac[1])}" fill="none"
      stroke="${sea.accent}" stroke-width="${active ? 12 : 8}" stroke-linecap="butt"
      opacity="${active ? 1 : 0.42}"/>`;
  }).join('');
  const [mx, my] = polar(cx, cy, r, yearFraction(now));
  const dateStr = now.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' }).toUpperCase();

  document.getElementById('year-wheel').innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(232,220,193,0.12)" stroke-width="13"/>
    ${arcs}
    <circle cx="${mx.toFixed(2)}" cy="${my.toFixed(2)}" r="6" fill="${s.accent}" stroke="#241d14" stroke-width="2"/>
    <text class="wheel-center-season" x="90" y="88" text-anchor="middle">${s.label}</text>
    <text class="wheel-center-date" x="90" y="103" text-anchor="middle">${dateStr}</text>`;

  document.getElementById('wheel-legend').innerHTML = order.map(k => {
    const sea = SEASONS[k], now2 = (sea === s);
    return `<div class="${now2 ? 'is-now' : ''}"><span class="sw" style="background:${sea.accent}"></span>${now2 ? `<b>${sea.label} — teraz</b>` : sea.label}</div>`;
  }).join('');
})();

async function handleLogin() {
  const name = document.getElementById('name-input').value.trim();
  const email = document.getElementById('email-input').value.trim().toLowerCase();
  const location = document.getElementById('location-input').value.trim();
  const status = document.getElementById('login-status');

  const fail = (msg) => {
    status.style.display = 'block';
    status.style.background = 'var(--alarm-wash)';
    status.style.color = 'var(--alarm)';
    status.style.border = '1px solid var(--alarm)';
    status.textContent = msg;
  };

  if (!name || !email || !location) return fail('Uzupełnij wszystkie pola, by założyć kalendarz.');
  if (!email.includes('@')) return fail('Podaj poprawny adres email.');

  status.style.display = 'block';
  status.style.background = 'var(--paper-deep)';
  status.style.color = 'var(--ink-soft)';
  status.style.border = '1px solid var(--rule)';
  status.textContent = 'Zakładam kalendarz...';

  try {
    const r = await fetch(`${API}/users`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: email, name, location, language: 'Polish'})
    });
    if (!r.ok) throw new Error('API error');

    localStorage.setItem('user_id', email);
    localStorage.setItem('user_name', name);
    localStorage.setItem('user_location', location);
    window.location.href = 'dashboard.html';
  } catch (e) {
    fail('Nie udało się połączyć. Spróbuj ponownie.');
  }
}

['name-input', 'email-input', 'location-input'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
});
</script>
</body>
</html>
